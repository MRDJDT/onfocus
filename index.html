function TeacherMode({ db, teacher, onBoardTimer, onExit, onSignOut }) {
  const uid = teacher?.uid || null;
  // Only pre-load localStorage if it belongs to the same user
  const isSameUser = (() => { try { return localStorage.getItem('ft_last_uid') === uid; } catch { return false; }})();
  const [classes, setClasses]       = useState(()=> isSameUser ? loadClasses() : []);
  const [activeClsId, setActiveClsId] = useState(()=>{
    if (!isSameUser) return '';
    const saved = loadActiveClassId();
    const all = loadClasses();
    return (saved && all.find(c=>c.id===saved)) ? saved : (all[0]?.id||'');
  });
  const activeCls = classes.find(c=>c.id===activeClsId) || classes[0] || {id:'',name:'',code:''};
  const [tasks, setTasks]           = useState(()=>loadTasksForClass(activeCls.id));
  const [editing, setEditing]       = useState(null);
  const [settings, setSettings]     = useState(loadSettings);
  const [showSettings, setShowSettings] = useState(false);
  const [showLive, setShowLive]     = useState(false);
  const [showQR, setShowQR]         = useState(false);
  const [showClasses, setShowClasses] = useState(false);
  const [showArchived, setShowArchived] = useState(false);
  const [filterSubject, setFilterSubject] = useState('all');
  const [filterDate, setFilterDate] = useState('all');
  const [newClassName, setNewClassName] = useState('');
  const [publishState, setPublishState] = useState('idle');
  const [helpNames, setHelpNames]   = useState({});
  const [checkinPeople, setCheckinPeople] = useState({});
  const helpCount = Object.keys(helpNames).length;

  // Firestore helpers — write teacher's classes and tasks to db
  const fbSaveClasses = cls => {
    if (!db || !uid) return;
    db.doc('teachers/'+uid).set({classes: cls}, {merge: true}).catch(()=>{});
  };
  // Firestore throws on `undefined` values, so strip them before any write
  const clean = v => JSON.parse(JSON.stringify(v));
  const fbSaveTasks = (classId, taskList, cls) => {
    if (!db || !uid) return;
    try { taskList = clean(taskList); } catch(e) { console.warn('Task save failed:', e); return; }
    db.doc('teachers/'+uid+'/tasks/'+classId).set({items: taskList}).catch(e=>console.warn('Task save failed:', e));
    // keep published class in sync so pupils always see current tasks
    const code = (cls || classes.find(c=>c.id===classId))?.code;
    const name = (cls || classes.find(c=>c.id===classId))?.name;
    if (code) db.doc('classes/'+code).set({name: name||'', tasks: taskList.filter(t=>!t.archived), updatedAt: Date.now()}).catch(e=>console.warn('Publish failed:', e));
  };

  // Build sample classes + tasks (called on first login or Firestore failure)
  const makeSampleData = () => {
    const g = ()=>Math.random().toString(36).slice(2,10);
    const today = todayISO();
    const cls = [
      { id:g(), name:'7A English', code:genClassCode() },
      { id:g(), name:'8B Maths',   code:genClassCode() },
      { id:g(), name:'9C Science', code:genClassCode() },
    ];
    const tasks = {
      [cls[0].id]: [
        { id:g(), subject:'english', title:'Descriptive Writing', date:today, timerMins:20,
          vocab:[{id:g(),word:'Adjective',def:'A word that describes a noun, e.g. "golden", "enormous"'},{id:g(),word:'Adverb',def:'A word that modifies a verb, e.g. "silently", "suddenly"'},{id:g(),word:'Simile',def:'A comparison using "like" or "as", e.g. "as cold as ice"'}],
          steps:[
            {id:g(),type:'copy_title'},
            {id:g(),type:'instruction',icon:'📖',text:'Read the extract on the board carefully',detail:'Look for examples of descriptive language — underline any you spot'},
            {id:g(),type:'think',icon:'🤔',text:'What can the character see, hear, smell, touch and taste?',detail:'Jot down ideas — you can use the word bank to help'},
            {id:g(),type:'task',icon:'✏️',text:'Write your own descriptive paragraph',detail:'Try to use at least one adjective, one adverb and one simile'},
            {id:g(),type:'task',icon:'🌟',text:'Swap with a partner and highlight their best phrase',detail:'Tell them why you chose it'},
          ]},
        { id:g(), subject:'english', title:'Reading Comprehension', date:today, timerMins:30,
          vocab:[{id:g(),word:'Inference',def:'Working out something the author implies but doesn\'t say directly'},{id:g(),word:'Evidence',def:'A quote from the text that supports your answer'}],
          steps:[
            {id:g(),type:'copy_title_full'},
            {id:g(),type:'instruction',icon:'📖',text:'Read the passage on pages 12–13 carefully',detail:'Read it through twice before answering any questions'},
            {id:g(),type:'task',icon:'✏️',text:'Answer questions 1–4 in full sentences',detail:'Use the PEE structure: Point, Evidence, Explain'},
            {id:g(),type:'task',icon:'🌟',text:'Extension: Why did the author choose this language?',detail:'Think about the effect on the reader'},
          ]},
      ],
      [cls[1].id]: [
        { id:g(), subject:'maths', title:'Solving Linear Equations', date:today, timerMins:25,
          vocab:[{id:g(),word:'Variable',def:'A letter representing an unknown number, e.g. x or y'},{id:g(),word:'Equation',def:'A mathematical statement that two things are equal'}],
          steps:[
            {id:g(),type:'copy_title'},
            {id:g(),type:'instruction',icon:'📐',text:'Watch the worked example on the board',detail:'Write it into your book step by step'},
            {id:g(),type:'task',icon:'✏️',text:'Complete questions 1–5 (page 47)',detail:'Show every step of your working'},
            {id:g(),type:'task',icon:'🌟',text:'Challenge: Try questions A–C',detail:'These use two-step equations'},
            {id:g(),type:'think',icon:'🤔',text:'Check your answers',detail:'Substitute your answer back into the equation — does it balance?'},
          ]},
        { id:g(), subject:'maths', title:'Fractions, Decimals & Percentages', date:today, timerMins:20,
          vocab:[{id:g(),word:'Numerator',def:'The top number of a fraction'},{id:g(),word:'Denominator',def:'The bottom number of a fraction'}],
          steps:[
            {id:g(),type:'copy_title'},
            {id:g(),type:'instruction',icon:'📐',text:'Copy the key equivalences from the board',detail:'½ = 0.5 = 50%, ¼ = 0.25 = 25%, ¾ = 0.75 = 75%'},
            {id:g(),type:'task',icon:'✏️',text:'Convert the fractions on Worksheet 3A to decimals',detail:'Divide the numerator by the denominator'},
            {id:g(),type:'task',icon:'✏️',text:'Convert your decimals to percentages',detail:'Multiply by 100'},
            {id:g(),type:'task',icon:'🌟',text:'Highlight any you found tricky',detail:'We will go through these together at the end'},
          ]},
      ],
      [cls[2].id]: [
        { id:g(), subject:'science', title:'Photosynthesis', date:today, timerMins:30,
          vocab:[{id:g(),word:'Chlorophyll',def:'The green pigment in leaves that absorbs sunlight'},{id:g(),word:'Glucose',def:'The sugar produced by photosynthesis'},{id:g(),word:'Chloroplast',def:'The part of a plant cell where photosynthesis takes place'}],
          steps:[
            {id:g(),type:'copy_title_full'},
            {id:g(),type:'instruction',icon:'🔬',text:'Copy the word equation into your book',detail:'Carbon dioxide + Water → Glucose + Oxygen  (needs light and chlorophyll)'},
            {id:g(),type:'task',icon:'✏️',text:'Label the leaf diagram (Worksheet 2B)',detail:'Include: upper epidermis, palisade cells, chloroplasts, stomata'},
            {id:g(),type:'task',icon:'✏️',text:'Explain in your own words why plants need sunlight',detail:'Write at least three sentences'},
            {id:g(),type:'think',icon:'🤔',text:'What would happen to a plant kept in complete darkness?',detail:'Discuss with your partner, then write your prediction'},
          ]},
        { id:g(), subject:'science', title:'The Periodic Table', date:today, timerMins:20,
          vocab:[{id:g(),word:'Element',def:'A pure substance made of only one type of atom'},{id:g(),word:'Atomic number',def:'The number of protons in an atom\'s nucleus'},{id:g(),word:'Period',def:'A horizontal row in the Periodic Table'}],
          steps:[
            {id:g(),type:'copy_title'},
            {id:g(),type:'instruction',icon:'🔬',text:'Look at the Periodic Table — find the metals and non-metals',detail:'Metals are on the left, non-metals on the right (with a staircase boundary)'},
            {id:g(),type:'task',icon:'✏️',text:'Note the lightest element, the heaviest shown, and three you recognise',detail:'Write their names, symbols and atomic numbers'},
            {id:g(),type:'task',icon:'🌟',text:'Complete the element fact file for your assigned element',detail:'Include: symbol, atomic number, type (metal/non-metal), one use'},
          ]},
      ],
    };
    return { cls, tasks };
  };

  const applySeed = ({ cls, tasks }) => {
    setClasses(cls); saveClasses(cls);
    cls.forEach(c => { const t = tasks[c.id]||[]; saveTasksForClass(c.id, t); });
    const firstId = cls[0].id;
    setActiveClsId(firstId); saveActiveClassId(firstId);
    setTasks(tasks[firstId] || []);
  };

  // Load classes + tasks from Firestore on login; seed sample data on first use
  useEffect(()=>{
    if (!db || !uid) return;

    db.doc('teachers/'+uid).get().then(snap=>{
      try { localStorage.setItem('ft_last_uid', uid); } catch {}
      if (snap.exists && snap.data().classes?.length) {
        const fbClasses = snap.data().classes;
        setClasses(fbClasses);
        saveClasses(fbClasses);
        const saved = loadActiveClassId();
        const activeId = (saved && fbClasses.find(c=>c.id===saved)) ? saved : fbClasses[0]?.id || '';
        setActiveClsId(activeId);
      } else {
        // First login — seed sample classes and tasks
        const seed = makeSampleData();
        applySeed(seed);
        db.doc('teachers/'+uid).set({classes: seed.cls}).catch(()=>{});
        seed.cls.forEach(c => {
          const t = seed.tasks[c.id] || [];
          db.doc('teachers/'+uid+'/tasks/'+c.id).set({items: t}).catch(()=>{});
          db.doc('classes/'+c.code).set({name: c.name, tasks: t, updatedAt: Date.now()}).catch(()=>{});
        });
      }
    }).catch(()=>{
      // Firestore unavailable (expired rules, offline, etc.) — seed locally so the user
      // always sees something on first login
      try { localStorage.setItem('ft_last_uid', uid); } catch {}
      if (!classes.length) applySeed(makeSampleData());
    });
  },[db, uid]);

  // reload tasks when active class changes (Firestore first, localStorage fallback)
  useEffect(()=>{
    setHelpNames({}); setCheckinPeople({});
    if (!activeCls.id) return;
    if (db && uid) {
      db.doc('teachers/'+uid+'/tasks/'+activeCls.id).get().then(snap=>{
        if (snap.exists) {
          const fbTasks = snap.data().items || [];
          setTasks(fbTasks);
          saveTasksForClass(activeCls.id, fbTasks);
        } else {
          setTasks(loadTasksForClass(activeCls.id));
        }
      }).catch(()=>setTasks(loadTasksForClass(activeCls.id)));
    } else {
      setTasks(loadTasksForClass(activeCls.id));
    }
  },[activeCls.id, db, uid]);

  // live signals subscription
  useEffect(()=>{
    const code = activeCls.code;
    if (!db || !code) return;
    const u1 = db.doc('helpSignals/'+code).onSnapshot(snap=>{ setHelpNames(snap.exists?(snap.data().names||{}):{}); },()=>{});
    const u2 = db.doc('checkins/'+code).onSnapshot(snap=>{ setCheckinPeople(snap.exists?(snap.data().people||{}):{}); },()=>{});
    return ()=>{ u1(); u2(); };
  },[db, activeCls.code]);

  const saveTask = t => {
    const next = tasks.find(x=>x.id===t.id) ? tasks.map(x=>x.id===t.id?t:x) : [...tasks,t];
    setTasks(next); saveTasksForClass(activeCls.id, next); fbSaveTasks(activeCls.id, next); setEditing(null);
  };
  const delTask = id => {
    const next = tasks.filter(t=>t.id!==id);
    setTasks(next); saveTasksForClass(activeCls.id, next); fbSaveTasks(activeCls.id, next);
  };
  const archiveTask = (id, archived) => {
    const next = tasks.map(t=>t.id===id?{...t,archived}:t);
    setTasks(next); saveTasksForClass(activeCls.id, next); fbSaveTasks(activeCls.id, next);
  };
  const updSet = patch => { const s={...settings,...patch}; setSettings(s); saveSettings(s); };

  const switchClass = id => {
    saveActiveClassId(id); setActiveClsId(id);
    setShowClasses(false); setPublishState('idle');
  };
  const createClass = () => {
    if (!newClassName.trim()) return;
    const cls = { id: genId(), name: newClassName.trim(), code: genClassCode() };
    const next = [...classes, cls]; setClasses(next); saveClasses(next); fbSaveClasses(next);
    if (db) db.doc('classes/'+cls.code).set({name: cls.name, tasks: [], updatedAt: Date.now()}).catch(()=>{});
    setNewClassName(''); switchClass(cls.id);
  };
  const deleteClass = (e, id) => {
    e.stopPropagation();
    if (classes.length <= 1) return;
    const next = classes.filter(c=>c.id!==id); setClasses(next); saveClasses(next); fbSaveClasses(next);
    if (activeClsId === id) switchClass(next[0].id);
  };

  const publishToClass = async () => {
    if (!db) { setPublishState('err'); setTimeout(()=>setPublishState('idle'),3000); return; }
    setPublishState('loading');
    try {
      await db.doc('classes/'+activeCls.code).set({name:activeCls.name,tasks:clean(tasks.filter(t=>!t.archived)),updatedAt:Date.now()});
      setPublishState('ok'); setTimeout(()=>setPublishState('idle'),3500);
    } catch { setPublishState('err'); setTimeout(()=>setPublishState('idle'),3000); }
  };

  const clearHelp = async () => {
    setHelpNames({});
    if (db && activeCls.code) try { await db.doc('helpSignals/'+activeCls.code).set({names:{},updatedAt:Date.now()}); } catch {}
  };
  const clearCheckins = async () => {
    setCheckinPeople({});
    if (db && activeCls.code) try { await db.doc('checkins/'+activeCls.code).set({people:{},updatedAt:Date.now()}); } catch {}
  };

  const checkinNamesByReaction = { happy:[], ok:[], unsure:[] };
  Object.entries(checkinPeople).forEach(([name,reaction])=>{ if(checkinNamesByReaction[reaction]) checkinNamesByReaction[reaction].push(name); });
  const totalCheckins = Object.keys(checkinPeople).length;
  const qrUrl = `https://onfocus.edapp.uk?class=${activeCls.code}`;

  const archivedTasks = tasks.filter(t=>t.archived);
  const today = todayISO();
  const visibleTasks = tasks.filter(t=>{
    if (t.archived) return false;
    if (filterSubject!=='all' && t.subject!==filterSubject) return false;
    if (filterDate==='today' && t.date!==today) return false;
    if (filterDate==='upcoming' && t.date<today) return false;
    if (filterDate==='past' && t.date>=today) return false;
    return true;
  });

  if (editing) return html`<${TaskEditor} init=${editing==='new'?null:editing} onSave=${saveTask} onCancel=${()=>setEditing(null)}/>`;

  return html`<div class="t-screen">
    ${showQR?html`<${QRModal} url=${qrUrl} onClose=${()=>setShowQR(false)}/>`:null}
    <div class="ph">
      <button class="back" onClick=${onExit}>← Home</button>
      <h1>👩‍🏫 ${teacher?.displayName||'Teacher'}</h1>
      <button class="btn btn-secondary" style=${{padding:'8px 13px',fontSize:'.85rem',minHeight:'38px',gap:'5px'}} onClick=${onBoardTimer}>⏱ Board Timer</button>
      <button class="icon-btn" title="Pupil QR Code" style=${{fontSize:'1.2rem'}} onClick=${()=>setShowQR(s=>!s)}>📱</button>
      <button class="icon-btn" style=${{fontSize:'1.1rem',position:'relative'}} onClick=${()=>setShowLive(s=>!s)}>
        📡${helpCount>0?html`<span class="help-badge">${helpCount}</span>`:null}
      </button>
      <button class="icon-btn" style=${{fontSize:'1.3rem'}} onClick=${()=>setShowSettings(s=>!s)}>⚙️</button>
      ${onSignOut?html`<button class="icon-btn" title="Sign out" style=${{fontSize:'1.1rem'}} onClick=${onSignOut}>🚪</button>`:null}
    </div>

    <div class="t-body">
      <!-- CLASS SELECTOR -->
      <div class="settings-panel" style=${{marginBottom:'4px'}}>
        <div style=${{display:'flex',alignItems:'center',gap:10}}>
          <h3 style=${{margin:0,flex:1}}>📚 ${activeCls.name}</h3>
          <span class="cs-code" style=${{fontSize:'.78rem'}}>${activeCls.code}</span>
          <button class="btn btn-ghost" style=${{padding:'5px 12px',fontSize:'.82rem',minHeight:'34px'}} onClick=${()=>setShowClasses(s=>!s)}>
            ${showClasses?'▲ Hide':'▼ My Classes'}
          </button>
        </div>
        ${showClasses?html`<div style=${{marginTop:'12px'}}>
          <div class="class-list">
            ${classes.map(c=>html`<div key=${c.id} class=${'class-item'+(c.id===activeClsId?' active':'')} onClick=${()=>switchClass(c.id)}>
              <span class="class-item-name">${c.name}</span>
              <span class="class-item-code">${c.code}</span>
              ${classes.length>1?html`<button class="class-item-del" onClick=${e=>deleteClass(e,c.id)} title="Delete class">🗑️</button>`:null}
            </div>`)}
          </div>
          <div class="new-class-row" style=${{marginTop:'10px'}}>
            <input type="text" placeholder="New class name…" value=${newClassName} onInput=${e=>setNewClassName(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&createClass()}/>
            <button class="btn btn-primary" style=${{padding:'8px 14px',minHeight:'38px'}} onClick=${createClass}>+ Add</button>
          </div>
        </div>`:null}
      </div>

      <!-- LIVE SIGNALS -->
      ${showLive?html`<div class="settings-panel">
        <h3>📡 Live — ${activeCls.name}</h3>
        <div class="live-row">
          <span>🙋 Help requests:</span>
          <strong style=${{fontSize:'1.5rem',color:helpCount>0?'var(--red)':'var(--text)'}}>${helpCount}</strong>
          ${helpCount>0?html`<button class="btn btn-ghost" style=${{padding:'5px 12px',fontSize:'.82rem',minHeight:'34px'}} onClick=${clearHelp}>Clear</button>`:null}
          ${helpCount>0?html`<div class="live-names">${Object.keys(helpNames).map(n=>html`<span key=${n} class="live-name-chip">${n}</span>`)}</div>`:null}
        </div>
        <div class="live-row">
          <span>Check-ins:</span>
          <div class="ci-tally">
            <div class="ci-group"><span>😊 ${checkinNamesByReaction.happy.length}</span><div class="live-names">${checkinNamesByReaction.happy.map(n=>html`<span key=${n} class="live-name-chip">${n}</span>`)}</div></div>
            <div class="ci-group"><span>😐 ${checkinNamesByReaction.ok.length}</span><div class="live-names">${checkinNamesByReaction.ok.map(n=>html`<span key=${n} class="live-name-chip">${n}</span>`)}</div></div>
            <div class="ci-group"><span>😕 ${checkinNamesByReaction.unsure.length}</span><div class="live-names">${checkinNamesByReaction.unsure.map(n=>html`<span key=${n} class="live-name-chip">${n}</span>`)}</div></div>
            ${totalCheckins>0?html`<button class="btn btn-ghost" style=${{padding:'4px 10px',fontSize:'.78rem',minHeight:'32px'}} onClick=${clearCheckins}>Clear</button>`:null}
          </div>
        </div>
        ${!db?html`<p style=${{color:'var(--faint)',fontSize:'.82rem',fontWeight:700}}>⚠️ Live signals need Firebase configured</p>`:null}
      </div>`:null}

      <!-- SETTINGS -->
      ${showSettings?html`<div class="settings-panel">
        <h3>🔧 Noise Meter</h3>
        <div class="srow">
          <label>Warning level: ${settings.warnAt}%</label>
          <input type="range" min="10" max="80" value=${settings.warnAt} onInput=${e=>updSet({warnAt:+e.target.value})}/>
        </div>
        <div class="srow">
          <label>Alert level: ${settings.alertAt}%</label>
          <input type="range" min="30" max="95" value=${settings.alertAt} onInput=${e=>updSet({alertAt:+e.target.value})}/>
        </div>
      </div>`:null}

      <!-- TASKS -->
      <div class="tasks-hdr">
        <h2>${activeCls.name} Tasks (${visibleTasks.length})</h2>
        <div class="tasks-hdr-sub">
          <p class="tasks-hdr-code">Pupils join with code: <strong>${activeCls.code}</strong></p>
          ${publishState==='ok'?html`<span class="cs-ok">✅ Published to ${activeCls.name}!</span>`:
            publishState==='err'?html`<span class="cs-err">❌ ${db?'Publish failed — try again':'Firebase needed for class sync'}</span>`:null}
        </div>
        <button class="btn btn-primary" onClick=${()=>setEditing('new')}>+ Create Task</button>
      </div>

      <!-- FILTERS -->
      ${tasks.length>0?html`<div class="task-filters">
        <div class="chips">
          <button class=${'chip'+(filterSubject==='all'?' sel':'')} onClick=${()=>setFilterSubject('all')}>All subjects</button>
          ${SUBJECTS.map(s=>html`<button key=${s.id} class=${'chip'+(filterSubject===s.id?' sel':'')} style=${{'--cc':s.col}} onClick=${()=>setFilterSubject(s.id)}>${s.emoji} ${s.label}</button>`)}
        </div>
        <select class="date-filter" value=${filterDate} onChange=${e=>setFilterDate(e.target.value)}>
          <option value="all">All dates</option>
          <option value="today">Today</option>
          <option value="upcoming">Upcoming</option>
          <option value="past">Past</option>
        </select>
      </div>`:null}

      ${tasks.length===0?html`<div class="empty"><div class="empty-ico">📝</div><p class="empty-txt">No tasks for ${activeCls.name} yet — create your first one!</p></div>`:
      visibleTasks.length===0?html`<div class="empty"><div class="empty-ico">🔍</div><p class="empty-txt">No tasks match this filter</p></div>`:
      html`<div class="task-grid">${visibleTasks.map(task=>{
        const s=SUBJECTS.find(x=>x.id===task.subject)||SUBJECTS[7];
        return html`<div key=${task.id} class="task-card" style=${{'--cc':s.col}}>
          <div class="tc-icon-hdr" style=${{background:s.light}}>${s.emoji}</div>
          <div class="tc-top">
            <span class="sub-badge" style=${{background:s.light,color:s.dark}}>${s.emoji} ${s.label}</span>
            <div class="tc-actions">
              <button class="icon-btn" onClick=${()=>setEditing(task)}>✏️</button>
              <button class="icon-btn" title="Archive" onClick=${()=>archiveTask(task.id,true)}>📦</button>
              <button class="icon-btn danger" onClick=${()=>delTask(task.id)}>🗑️</button>
            </div>
          </div>
          <div class="tc-body">
            <div class="tc-title">${task.title}</div>
            <div class="tc-meta">
              <span>${fmtDate(task.date)}</span>
              <span>${task.steps.length} step${task.steps.length!==1?'s':''}</span>
              ${task.timerMins>0?html`<span>⏱ ${task.timerMins}min</span>`:null}
              ${(task.vocab||[]).length>0?html`<span>📖 ${task.vocab.length} word${task.vocab.length!==1?'s':''}</span>`:null}
            </div>
          </div>
          <div class="tc-foot"><button class="btn btn-orange btn-full" onClick=${publishToClass} disabled=${publishState==='loading'}>${publishState==='loading'?'⏳ Publishing…':'📡 Publish to Class'}</button></div>
        </div>`;
      })}</div>`}

      <!-- ARCHIVED -->
      ${archivedTasks.length>0?html`<div class="archived-block">
        <button class="btn btn-ghost btn-full" onClick=${()=>setShowArchived(s=>!s)}>${showArchived?'▲ Hide':'▼ Show'} archived (${archivedTasks.length})</button>
        ${showArchived?html`<div class="archived-list">${archivedTasks.map(task=>{
          const s=SUBJECTS.find(x=>x.id===task.subject)||SUBJECTS[7];
          return html`<div key=${task.id} class="archived-item">
            <span class="archived-item-emoji">${s.emoji}</span>
            <span class="archived-item-title">${task.title}</span>
            <span class="archived-item-date">${fmtDate(task.date)}</span>
            <button class="icon-btn" title="Restore" onClick=${()=>archiveTask(task.id,false)}>↩️</button>
            <button class="icon-btn danger" onClick=${()=>delTask(task.id)}>🗑️</button>
          </div>`;
        })}</div>`:null}
      </div>`:null}
    </div>
  </div>`;
}

// ── PinModal ───────────────────────────────────────────────────
function PinModal({ pin, onOk, onCancel }) {
  const [entered,setEntered] = useState('');
  const [err,setErr] = useState(false);
  const press=d=>{
    if(d==='⌫'){setEntered(e=>e.slice(0,-1));setErr(false);return;}
    if(entered.length>=4)return;
    const next=entered+d; setEntered(next); setErr(false);
    if(next.length===4) setTimeout(()=>next===pin?onOk():(setErr(true),setEntered('')),180);
  };
  return html`<div class="overlay" onClick=${onCancel}>
    <div class="pin-box" onClick=${e=>e.stopPropagation()}>
      <div class="pin-title">🔐 Teacher Login</div>
      <p class="pin-hint">Enter your PIN to continue</p>
      <div class=${'pin-dots'+(err?' err':'')}>
        ${[0,1,2,3].map(i=>html`<div key=${i} class=${'pin-dot'+(entered.length>i?' on':'')}></div>`)}
      </div>
      ${err?html`<p class="pin-err">Incorrect PIN — try again</p>`:null}
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((d,i)=>html`<button key=${i} class=${'pin-key'+(d===''?' ghost':'')} onClick=${()=>d!==''&&press(String(d))}>${d}</button>`)}
      </div>
      <button class="btn btn-ghost btn-full" style=${{marginTop:'-4px'}} onClick=${onCancel}>Cancel</button>
    </div>
  </div>`;
}

// ── ClassJoin ──────────────────────────────────────────────────
function ClassJoin({ db, initialCode, onLoaded, onBack }) {
  const [code,setCode] = useState(()=>(initialCode||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6));
  const [loading,setLoading] = useState(false);
  const [err,setErr] = useState('');
  const join=async(overrideCode)=>{
    const c=(overrideCode||code).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    if(c.length<6){setErr('Please enter the full 6-character code');return;}
    if(!db){setErr('Class sync is not available — please try again');return;}
    setLoading(true);setErr('');
    try{
      const snap=await db.doc('classes/'+c).get();
      if(!snap.exists){setErr('Code not found — check with your teacher');setLoading(false);return;}
      const data=snap.data();
      onLoaded(data.tasks||[],data.name||'Class Tasks',c);
    }catch{setErr('Could not connect — please try again');setLoading(false);}
  };
  // Auto-join when arriving via QR code URL
  useEffect(()=>{
    if(initialCode&&initialCode.length===6&&db) join(initialCode);
  },[db]);
  return html`<div class="ps-screen">
    <div class="ps-hdr"><button class="ps-back" onClick=${onBack}>← Back</button><h1>🔗 Join Your Class</h1></div>
    <div class="cj-box">
      <div class="cj-qr-section">
        <div class="cj-qr-icon">📷</div>
        <p class="cj-qr-text">Scan the QR code your teacher shows you with your phone camera</p>
        <div class="cj-divider"><span>or enter the code</span></div>
      </div>
      <input class="cj-code-input" value=${code} maxlength="6" placeholder="e.g. LION42" inputmode="text" autocomplete="off"
        onInput=${e=>{setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''));setErr('');}}
        onKeyDown=${e=>e.key==='Enter'&&join()}/>
      ${err?html`<p class="cj-err">${err}</p>`:null}
      <button class="btn btn-primary btn-full" onClick=${()=>join()} disabled=${loading}>${loading?'⏳ Joining…':'→ Join Class'}</button>
    </div>
    <p class="cj-hint">Your teacher will show the code or QR on the board</p>
  </div>`;
}

// ── App ────────────────────────────────────────────────────────
function App() {
  const [urlClassCode]               = useState(()=>{ try{return new URLSearchParams(window.location.search).get('class')||'';}catch{return '';} });
  const [screen,setScreen]           = useState(()=>urlClassCode?'classjoin':'landing');
  const [activeTask,setActiveTask]   = useState(null);
  const [activeSettings,setActiveSettings] = useState(loadSettings);
  const [db,setDb]                   = useState(null);
  const [classTasks,setClassTasks]   = useState(null);
  const [className,setClassName]     = useState('');
  const [joinedClassCode,setJoinedClassCode] = useState('');
  const [teacher,setTeacher]         = useState(null);   // Firebase User | null
  const [authReady,setAuthReady]     = useState(!_fbAuth); // true when no firebase

  // Init db — prefer Firebase if configured, fall back to claude.ai Artifact db
  useEffect(()=>{
    if (_fbDb) { setDb(_fbDb); return; }
    if (window.claude && typeof window.claude.use==='function')
      window.claude.use('db').then(d=>{if(d)setDb(d);}).catch(()=>{});
  },[]);

  // Listen to Firebase auth state
  useEffect(()=>{
    if (!_fbAuth) return;
    const unsub = _fbAuth.onAuthStateChanged(user=>{
      setTeacher(user); setAuthReady(true);
      // If signed in and on landing, stay; if signed out while in teacher, go home
      if (!user && screen==='teacher') setScreen('landing');
    });
    return unsub;
  },[]);

  const signOut = () => { if(_fbAuth) _fbAuth.signOut(); setTeacher(null); setScreen('landing'); };
  const goTeacher = () => {
    if (_fbAuth && !teacher) { setScreen('teacherlogin'); }
    else { setScreen('teacher'); }
  };

  if (!authReady) return html`<div style=${{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--muted)',font:'700 1.1rem Nunito,sans-serif'}}>Loading…</div>`;

  if (screen==='stickers')     return html`<${StickerBook} onBack=${()=>setScreen('landing')}/>`;
  if (screen==='boardtimer')   return html`<${BoardTimer} onExit=${()=>setScreen('teacher')}/>`;
  if (screen==='teacherlogin') return html`<${TeacherLogin} onLoggedIn=${user=>{setTeacher(user);setScreen('teacher');}} onBack=${()=>setScreen('landing')}/>`;
  if (screen==='teacher')      return html`<${TeacherMode} db=${db} teacher=${teacher} onBoardTimer=${()=>setScreen('boardtimer')} onExit=${()=>setScreen('landing')} onSignOut=${_fbAuth?signOut:null}/>`;
  if (screen==='classjoin')    return html`<${ClassJoin} db=${db} initialCode=${urlClassCode} onLoaded=${(tasks,name,code)=>{setClassTasks(tasks);setClassName(name);setJoinedClassCode(code);setScreen('select');}} onBack=${()=>setScreen(classTasks?'select':'landing')}/>`;
  if (screen==='select')       return html`<${PupilSelect} classTasks=${classTasks} className=${className} onJoinClass=${()=>setScreen('classjoin')} onSelect=${t=>{setActiveTask(t);setActiveSettings({...loadSettings(),classCode:joinedClassCode,className});setScreen('pupil');}} onBack=${()=>{setClassTasks(null);setScreen('landing');}}/>`;
  if (screen==='pupil'&&activeTask) return html`<${PupilMode} task=${activeTask} settings=${activeSettings} db=${db} onExit=${()=>setScreen('landing')}/>`;
  return html`<${Landing} onTeacher=${goTeacher} onPupil=${()=>setScreen('classjoin')} onStickers=${()=>setScreen('stickers')} useFirebaseAuth=${!!_fbAuth}/>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
